<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>压缩包密码恢复</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f1419; color: #e6ebf0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, Roboto, sans-serif;
    }
    .box { text-align: center; max-width: 480px; padding: 24px; }
    .emoji { font-size: 52px; }
    h1 { font-size: 20px; margin: 14px 0 6px; }
    p { color: #8b96a3; font-size: 14px; line-height: 1.7; }
    .spinner {
      width: 34px; height: 34px; margin: 18px auto 0;
      border: 3px solid #2a333d; border-top-color: #2dd4bf;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; }
    .err pre {
      white-space: pre-wrap; text-align: left; background: #1a2129;
      border: 1px solid #2a333d; border-radius: 10px; padding: 14px;
      color: #f87171; font-size: 13px; margin-top: 14px;
    }
    code { background: #1a2129; padding: 2px 6px; border-radius: 5px; color: #2dd4bf; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="box">
    <div id="loading">
      <div class="emoji">🔓</div>
      <h1>正在启动…</h1>
      <p>正在拉起本地恢复引擎，请稍候。</p>
      <div class="spinner"></div>
    </div>

    <div id="error" class="err">
      <div class="emoji">⚠️</div>
      <h1>启动失败</h1>
      <p>后端没能启动。最常见原因是<strong>没装 Python 3</strong>或<strong>没装 unrar</strong>。</p>
      <pre id="errmsg"></pre>
      <p style="margin-top:14px">在终端里安装依赖（macOS）：<br>
        <code>brew install python unrar</code><br>
        然后重新打开本应用。
      </p>
    </div>
  </div>

  <script>
    const hash = decodeURIComponent(location.hash || '');
    const m = hash.match(/error=(.*)$/);
    if (m) {
      document.getElementById('loading').classList.add('hidden');
      const err = document.getElementById('error');
      err.style.display = 'block';
      document.getElementById('errmsg').textContent = m[1];
    }
  </script>
</body>
</html>
