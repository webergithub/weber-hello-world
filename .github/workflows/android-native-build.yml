name: 原生 Android App 构建 (TrailMate)

# 编译原生 Android（android-native/）并产出**可直接安装的 debug APK**。
on:
  push:
    branches: [master, 'claude/**']
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件 (compileSdk 34)
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 生成 Gradle wrapper 并编译 Debug APK
        run: |
          cd android-native
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: trailmate-android-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
