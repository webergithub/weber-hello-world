plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cc.trailmate.app'
    compileSdk 34

    defaultConfig {
        applicationId 'cc.trailmate.app'
        minSdk 21              // Android 5.0，覆盖老机；BLE 广播/GATT 可用
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // 队伍二维码：生成用 zxing core（QRCodeWriter），扫码用 journeyapps 内嵌扫描器
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // 小票 OCR：ML Kit 文字识别（模型内置离线可用，无需 Google 服务；数字金额用拉丁模型足够）
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // 网络中继通道（BR-1.1）：WebSocket 客户端，与 BLE 并行；relayUrl 为空则完全不启用
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
