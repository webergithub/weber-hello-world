# ============================================================
# CityTwin · location 级配置（放 /etc/nginx/citytwin/10-citytwin-locations.conf）
# 用法：在你【已有的】主站 server 块里加一行：
#     include /etc/nginx/citytwin/*.conf;
# 绝不新建 server 块 —— 避免与同机其他站点抢 default_server。
# ============================================================

# ---- Google Photorealistic 3D Tiles 免 key 代理 ----
# 客户端请求 /citytwin/gtiles/v1/... → 剥前缀转发 tile.googleapis.com，追加服务端 key。
# root.json 返回的子 URI 携带 session 参数并相对解析回本代理，天然全程走代理。
location /citytwin/gtiles/ {
    limit_req zone=ct_tiles burst=60 nodelay;

    rewrite ^/citytwin/gtiles/(.*)$ /$1 break;
    proxy_pass https://tile.googleapis.com;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.googleapis.com;
    # 不把玩家的 UA/Referer 泄给上游，也避免 key 的 referer 限制误伤
    proxy_set_header Referer "";

    set $args $ct_tiles_args;          # 追加服务端 key（定义见 00-citytwin-http.conf）

    proxy_cache ct_tiles_cache;        # 短 TTL 性能缓存
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 30s;
    proxy_cache_key "$uri$is_args$args";
    add_header X-CT-Cache $upstream_cache_status;

    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_buffering on;
}

