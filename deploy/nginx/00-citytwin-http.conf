# ============================================================
# CityTwin · nginx http{} 级配置（放 /etc/nginx/conf.d/00-citytwin-http.conf）
# 只含 map / limit_req_zone / proxy_cache_path 这类必须在 http 层的指令。
# 所有符号带 ct_ 前缀，避免与同机其他站点（duplicate-finder/battleai）撞名。
# ============================================================

# Google Tiles 代理：把服务端持有的 key 追加到查询串（args 为空时不带多余的 &）
# __GOOGLE_KEY__ 由 server-setup.sh 在安装时替换为真实 key（key 只存在服务器上，不入仓库）
map $args $ct_tiles_args {
    ""      "key=__GOOGLE_KEY__";
    default "${args}&key=__GOOGLE_KEY__";
}

# 每 IP 限速：正常 3D 漫游峰值约 10-20 tile/s，30r/s + burst 足够；防公开代理被当免费 CDN 刷
limit_req_zone $binary_remote_addr zone=ct_tiles:10m rate=30r/s;

# 短 TTL 性能缓存（遵守 Map Tiles 条款：不做长期落盘复制）
proxy_cache_path /var/cache/nginx/ct_tiles levels=1:2 keys_zone=ct_tiles_cache:20m
                 max_size=500m inactive=30m use_temp_path=off;
