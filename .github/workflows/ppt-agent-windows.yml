name: PPT Agent Windows Build

on:
  push:
    paths:
      - 'ppt-agent/**'
      - '!ppt-agent/download/**'
      - '.github/workflows/ppt-agent-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ppt-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ppt-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vite build
      - run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PPT-Agent-win-x64-portable
          path: ppt-agent/release/*.exe
          retention-days: 30
