# CineRoute 影路 —— Nginx 反向代理
#
# 安装位置：
#   Oracle Linux / RHEL:  /etc/nginx/conf.d/cineroute.conf
#   Ubuntu / Debian:      /etc/nginx/sites-available/cineroute → sites-enabled/
#
# 改完必须先验证再重载，别直接 restart：
#   nginx -t && systemctl reload nginx
#
# ── 这份配置里有三处不能省的地方 ─────────────────────────────
#
# 1. /api/events 是 SSE（服务器推送下载进度）。Nginx 默认开着 proxy_buffering，
#    会把响应攒在缓冲区里等攒够再发——SSE 的事件就全卡住了，页面上进度条
#    永远不动。必须 proxy_buffering off。
#
# 2. /media 是视频流代理，要透传 Range 请求（拖进度条）。同样必须关缓冲，
#    否则 Nginx 会把整个视频先落到磁盘临时文件再转发，1GB 的片子就是
#    1GB 的磁盘写入 + 几十秒的首帧延迟。超时也要放宽。
#
# 3. 这套接口没有任何认证。/media 能代理归档站视频、/api/download 能让
#    服务器去下载文件——直接挂公网就是拿你的带宽和磁盘给全世界用。
#    下面留了 Basic Auth 的配置，强烈建议打开（见文件末尾）。

upstream cineroute {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    # 实例启用了 IPv6 再打开这行。没有 IPv6 的机器上它会让 nginx 直接起不来
    # （nginx: [emerg] socket() [::]:80 failed (97: Address family not supported)），
    # 而 Oracle Cloud 的 VCN 默认是不开 IPv6 的，所以默认注释掉。
    #listen [::]:80;
    server_name _;          # 换成你的域名，比如 cineroute.example.com

    # 有域名和证书的话，把上面 listen 80 换成下面这段，用 certbot 签证书：
    #   certbot --nginx -d cineroute.example.com
    # certbot 会自动改写这个 server 块，不用手写 ssl_ 那几行。

    access_log /var/log/nginx/cineroute.access.log;
    error_log  /var/log/nginx/cineroute.error.log;

    # 上传体积：PUT /api/sources 的请求体在应用里限死 64KB，这里给 1M 富余
    client_max_body_size 1m;

    # ── 通用代理头 ──────────────────────────────────────────
    # 定义成一份，下面每个 location 引用（Nginx 的 proxy_set_header 不会
    # 从外层继承到设置了自己的 proxy_set_header 的 location，所以要重复写；
    # 用 include 片段可以避免抄漏，见文件末尾的说明）。

    # ── SSE：下载进度推送 ───────────────────────────────────
    location = /api/events {
        proxy_pass http://cineroute;
        proxy_http_version 1.1;

        # SSE 的命门：不关缓冲，事件会被攒在 Nginx 里发不出来
        proxy_buffering off;
        proxy_cache off;

        # 长连接：清掉 Connection 头，别让 Nginx 发 "close"
        proxy_set_header Connection '';
        # 应用每 25 秒发一次心跳，读超时给到 1 小时足够
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 有些中间层会按 X-Accel-Buffering 决定是否缓冲
        add_header X-Accel-Buffering no;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 视频流代理 ──────────────────────────────────────────
    location = /media {
        proxy_pass http://cineroute;
        proxy_http_version 1.1;

        # 视频是边下边播，缓冲会把整个文件先落盘再转发
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;

        # 大文件传输慢，超时放宽
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Range 头默认就会透传，这里写出来是为了明示：拖进度条靠的就是它
        proxy_set_header Range     $http_range;
        proxy_set_header If-Range  $http_if_range;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 其余接口与静态页面 ──────────────────────────────────
    location / {
        proxy_pass http://cineroute;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # 检索要等多个上游源并发返回，30 秒偏紧，给到 120 秒
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 建议打开的访问控制 ──────────────────────────────
        # 这套接口本身没有登录。挂公网前二选一：
        #
        # (a) Basic Auth —— 先建密码文件：
        #       dnf install -y httpd-tools   # Ubuntu: apt-get install -y apache2-utils
        #       htpasswd -c /etc/nginx/.cineroute.htpasswd 你的用户名
        #     然后取消下面两行的注释：
        #
        # auth_basic           "CineRoute";
        # auth_basic_user_file /etc/nginx/.cineroute.htpasswd;
        #
        # (b) 只放行自己的 IP：
        #
        # allow 203.0.113.7;   # 换成你的公网 IP
        # deny  all;
    }
}

# ── 补充说明 ────────────────────────────────────────────────
#
# 上面四个 proxy_set_header 在三个 location 里重复了三遍，这是 Nginx 的
# 继承规则决定的：一个 location 里只要出现了 proxy_set_header，外层的就
# 全部不继承。想少抄一点可以把它们放进一个片段文件：
#
#   # /etc/nginx/snippets/cineroute-proxy-headers.conf
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#
# 然后每个 location 里写 include snippets/cineroute-proxy-headers.conf;
#
# SELinux（Oracle Linux 默认开着）不放行 Nginx 对外发起连接，
# 不设这个开关的话反代会 502，错误日志里是 "Permission denied"：
#
#   setsebool -P httpd_can_network_connect 1
#
# 端口放行在 Oracle Cloud 要改两个地方，只改一个不通：
#   firewall-cmd --permanent --add-service=http --add-service=https
#   firewall-cmd --reload
# 外加云控制台里 VCN 的安全列表 / NSG 入站规则（网页上操作）。
