# ============================================================
# CityTwin 自动部署到你的服务器（rsync over SSH）
#
# 使用前在 GitHub 仓库 Settings → Secrets and variables → Actions
# 添加 4 个 Repository secrets：
#   DEPLOY_HOST     服务器 IP 或域名
#   DEPLOY_USER     SSH 用户名（Oracle Cloud 通常是 opc）
#   DEPLOY_SSH_KEY  SSH 私钥内容（对应服务器 ~/.ssh/authorized_keys 里的公钥）
#   DEPLOY_PATH     目标目录（如 /var/www/citytwin 或 /home/opc/citytwin）
#
# 然后在仓库 Actions 页面手动 Run workflow，或推送到部署分支时自动触发。
# GitHub 托管的 runner 可直接访问公网服务器，不受本地网络限制。
# ============================================================
name: Deploy CityTwin to server

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/3d-hideandseek-game-8vw4y9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DEPLOY_* secrets，跳过部署（在仓库 Settings→Secrets 配置后重跑即可）"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via rsync
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            index.html game.js cities.js lib data README.md \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          echo "✅ 部署完成 → http://$DEPLOY_HOST/ (视你的 web 服务配置而定)"
