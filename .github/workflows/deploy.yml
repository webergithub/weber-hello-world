# ============================================================
# CityTwin 自动部署到 opc 服务器（rsync over SSH）
#
# 服务器/用户/路径已内置（来自 updateProject.md，非机密）：
#   HOST = 145.241.235.191   USER = ubuntu
#   PATH = /home/ubuntu/website/citytwin   →  http://145.241.235.191/citytwin/
#
# 你只需在 GitHub 配置【1 个】Secret 即可启用自动部署：
#   Settings → Secrets and variables → Actions → New repository secret
#   名称：DEPLOY_SSH_KEY
#   内容：Drive 里 ssh-key-2026-05-05.key 文件全文（-----BEGIN … END----- 整段）
#
# 如需改服务器，另配可选 Secret 覆盖默认值：
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_PATH
#
# 配好后：推送本分支即自动部署，或在 Actions 页面手动 Run workflow。
# GitHub 托管的 runner 可直接访问公网服务器，不受本地网络限制。
# ============================================================
name: Deploy CityTwin to server

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/3d-hideandseek-game-8vw4y9

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '145.241.235.191' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ubuntu/website/citytwin' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy key
        id: check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DEPLOY_SSH_KEY，跳过部署。在仓库 Settings→Secrets 添加该私钥后重跑即可自动部署。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via rsync
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -avz --delete \
            -e "$SSH" \
            index.html game.js cities.js lib data README.md \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Verify deployment
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
            "ls -lh '$DEPLOY_PATH/index.html' && echo VERIFY_OK"
          echo "✅ 部署完成 → http://$DEPLOY_HOST/citytwin/"
